<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support — Hawker Vendor</title>
  <link rel="stylesheet" href="../../css/tokens.css">
  <link rel="stylesheet" href="../../css/shared/liquidGlass.css">
  <link rel="stylesheet" href="../../css/shared/components.css">
  <link rel="stylesheet" href="../../css/shared/sidebarResponsive.css">
  <link rel="stylesheet" href="../../css/shared/appShell.css">
  <link rel="stylesheet" href="../../css/vendor-shell.css">
  <link rel="stylesheet" href="../../css/vendor/vendorHeader.css">
  <link rel="stylesheet" href="../../css/vendor/vendorNav.css">
  <link rel="stylesheet" href="../../css/vendor/support.css">
</head>
<body>
  <!-- Main Content -->
  <div class="mainContent">
    <div class="topBar">
      <div class="topBarBrand">
        <img class="topBarLogo" src="../../images/hawkrOS.svg" alt="HAWKR">
        <h1 class="topBarTitle">Support</h1>
      </div>
      <div class="global-search" id="globalSearch">
        <span class="icon search-icon" style="--icon: url(../../icons/search.svg)"></span>
        <input type="text" id="globalSearchInput" placeholder="Search anything..." autocomplete="off">
        <div class="global-search-results" id="globalSearchResults" hidden></div>
      </div>

      <div class="topBarActions" data-liquid-glass="drag">
        <div class="notification-bell" id="notificationBell" data-notification-bell style="position: relative;">
          <button class="topBarAction bell-btn" id="bellBtn" type="button" aria-label="Notifications">
            <span class="icon icon--lg bell-icon" style="--icon: url(../../icons/notifications.svg)"></span>
            <span class="bell-badge" id="bellBadge" hidden>0</span>
          </button>
          <div class="notification-panel" id="notificationPanel" hidden>
            <div class="notification-panel-header">
              <span>Notifications</span>
              <button type="button" id="markAllReadBtn">Mark all read</button>
            </div>
            <div class="notification-list" id="notificationList"></div>
          </div>
        </div>
        <button class="topBarAction" type="button" aria-label="Settings" data-href="vendor.html">
          <span class="icon icon--lg" style="--icon: url(../../icons/settings.svg)"></span>
        </button>
        <button class="topBarAction" id="logoutBtn" type="button" aria-label="Log out">
          <span class="icon icon--lg" style="--icon: url(../../icons/logout.svg)"></span>
        </button>
      </div>

    </div>

    <div class="page-title">
      <div class="page-sub">Something wrong at a centre? Tell us, and read the reply here.</div>
    </div>

    <div class="content">
      <div class="banner error" id="errorBanner"></div>
      <div class="banner success" id="successBanner"></div>

      <div class="support-seg" role="radiogroup" aria-label="Ticket filter">
        <button type="button" class="support-seg__btn is-active" data-ticket-filter="open">Open</button>
        <button type="button" class="support-seg__btn" data-ticket-filter="answered">Answered</button>
      </div>

      <div class="primary-action-bar">
        <button type="button" class="btn btn-primary" id="newTicketBtn">+ Raise a ticket</button>
      </div>

      <div id="ticketsOutput"></div>
    </div>

    <footer class="app-footer">&copy; 2026 Hawker Management System</footer>
  </div>

  <!-- New ticket modal -->
  <div class="modal-overlay" id="newTicketModal">
    <div class="modal support-modal">
      <h2>Raise a ticket</h2>
      <div class="modal-sub">Someone at the centre picks it up and writes back.</div>
      <form id="ticketForm">
        <div class="form-field">
          <label for="ticketHawkerId">Hawker centre</label>
          <select id="ticketHawkerId" required>
            <option value="" disabled selected>Choose a centre</option>
          </select>
        </div>
        <div class="form-field">
          <label for="ticketCategory">What is it about?</label>
          <select id="ticketCategory" required>
            <option value="" disabled selected>Choose a category</option>
            <option>Facility Issue</option>
            <option>Cleanliness</option>
            <option>Account Issue</option>
            <option>Billing/Rental</option>
            <option>Order/Payment</option>
            <option>Queue/Crowd</option>
            <option>Safety Concern</option>
            <option>Others</option>
          </select>
        </div>
        <div class="form-field" id="ticketOtherCategoryField" hidden>
          <label for="ticketOtherCategory">Describe the category</label>
          <input type="text" id="ticketOtherCategory" placeholder="e.g. Lost property">
        </div>
        <div class="form-field">
          <label for="ticketSubject">Subject</label>
          <input type="text" id="ticketSubject" maxlength="150" placeholder="One line — what happened" required>
        </div>
        <div class="form-field">
          <label for="ticketDescription">What happened?</label>
          <textarea id="ticketDescription" rows="5" placeholder="When it happened, where in the centre, and anything that would help someone find it." required></textarea>
        </div>
        <div class="form-field">
          <label for="ticketFiles">Attachments</label>
          <input type="file" id="ticketFiles" multiple accept="image/jpeg,image/png,video/mp4,video/quicktime">
          <div class="hint">Up to 10 files. Images under 5MB, videos under 50MB.</div>
        </div>
        <p class="ticket-form-error" id="ticketFormError" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="cancelTicketBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitTicketBtn">Send ticket</button>
        </div>
      </form>
    </div>
  </div>

  <nav class="bottomPillNav" aria-label="Primary" data-bottom-nav>
    <a class="bottomPillNav__item" href="dashboard.html" data-tab="dashboard">
      <span class="icon" style="--icon: url(../../icons/home.svg)"></span>
      <span>Dashboard</span>
    </a>
    <a class="bottomPillNav__item" href="orders.html" data-tab="orders">
      <span class="icon" style="--icon: url(../../icons/orders.svg)"></span>
      <span>Orders</span>
    </a>
    <a class="bottomPillNav__item" href="stall.html" data-tab="stall">
      <span class="icon" style="--icon: url(../../icons/organisation.svg)"></span>
      <span>My Stall</span>
    </a>
    <a class="bottomPillNav__item" href="orderHistory.html" data-tab="orderHistory">
      <span class="icon" style="--icon: url(../../icons/history.svg)"></span>
      <span>Order History</span>
    </a>
    <a class="bottomPillNav__item" href="support.html" data-tab="support">
      <span class="icon" style="--icon: url(../../icons/feedback.svg)"></span>
      <span>Support</span>
    </a>
  </nav>

  <script src="../../js/vendor/vendorNav.js"></script>
  <script src="../../js/vendor/support.js"></script>
  <script src="../../js/vendor/vendorHeader.js"></script>
  <script>
    renderBottomPillNav('support');
    if (!localStorage.getItem('authToken')) {
      window.location.href = '/auth/login.html';
    }
  </script>
  <script type="module" src="../../js/shared/liquidGlass.js"></script>
  <script type="module" src="../../js/shared/topBar.js"></script>
</body>
</html>
